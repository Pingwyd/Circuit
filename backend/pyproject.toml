[project]
name = "tournament-tracker-backend"
version = "0.1.0"
description = "Fortnite tournament tracker API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "httpx>=0.28,<0.29",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "apscheduler>=3.10,<4.0",
    "pydantic-settings>=2.6,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<0.9",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "respx>=0.21,<0.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
